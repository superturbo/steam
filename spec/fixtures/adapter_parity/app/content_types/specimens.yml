name: Specimens
slug: specimens
description: Every field state covered by adapter parity
label_field_name: name
order_by: name
fields:
- name:
    type: string
    hint: The name the entry is labelled by
    unique: true
- title:
    type: string
    localized: true
- score:
    type: integer
- price:
    type: float
- flag:
    type: boolean
- labels:
    type: tags
- payload:
    type: json
- notes:
    type: json
    localized: true
- status:
    type: string
    default: draft
- rank:
    type: integer
    default: 7
- blurb:
    type: string
    localized: true
    default:
      en: Pending
      fr: En attente
- visibility:
    type: select
    default: private
    select_options: ['public', 'private']
- category:
    type: select
    select_options: ['alpha', 'beta', 'gamma']
- tier:
    type: select
    localized: true
    default: Silver
    select_options:
      en: [Gold, Silver, R&D]
      fr: [Or, Argent, R&D fr]
- at:
    type: date_time
- held_on:
    type: date
- maker:
    type: belongs_to
    class_name: makers
- topics:
    type: many_to_many
    class_name: topics
