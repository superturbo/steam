name: Specimens
slug: specimens
description: Every field state covered by adapter parity
label_field_name: name
order_by: name
fields:
- name:
    type: string
    hint: The name the entry is labelled by
    unique: true
- title:
    type: string
    localized: true
- score:
    type: integer
- flag:
    type: boolean
- labels:
    type: tags
- payload:
    type: json
- category:
    type: select
    select_options: ['alpha', 'beta', 'gamma']
- tier:
    type: select
    localized: true
    select_options:
      en: [Gold, Silver]
      fr: [Or, Argent]
- at:
    type: date_time
- held_on:
    type: date
- maker:
    type: belongs_to
    class_name: makers
- topics:
    type: many_to_many
    class_name: topics
