name: Specimens
slug: specimens
label_field_name: name
order_by: name
fields:
- name:
    type: string
- title:
    type: string
    localized: true
- score:
    type: integer
- flag:
    type: boolean
- labels:
    type: tags
- payload:
    type: json
- category:
    type: select
    select_options: ['alpha', 'beta']
- at:
    type: date_time
- maker:
    type: belongs_to
    class_name: makers
- topics:
    type: many_to_many
    class_name: topics
